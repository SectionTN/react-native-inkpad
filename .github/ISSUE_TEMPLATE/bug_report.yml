name: Bug report
description: Report a bug you can reproduce in react-native-inkpad.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Fill in every field. A bug without a way to reproduce it is hard to fix, and the issue may be closed.
  - type: checkboxes
    attributes:
      label: Before you open the issue
      options:
        - label: I tried the latest version of react-native-inkpad, in case the bug is already fixed.
          required: true
        - label: My app runs a [supported version](https://github.com/reactwg/react-native-releases/blob/main/docs/support.md) of React Native.
          required: true
        - label: I searched the existing issues for a duplicate.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: |
        What happened, and what did you expect instead? Add error messages, stack traces, screenshots or a screen recording if you have them.
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: The react-native-inkpad version in your lockfile.
      placeholder: "x.x.x"
    validations:
      required: true
  - type: textarea
    id: react-native-info
    attributes:
      label: Environment info
      description: Paste the output of `react-native info`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: |
        List the steps, and include the code that renders the canvas.
      value: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: reproducible-example
    attributes:
      label: Reproducible example repository
      description: A link to a GitHub repository that reproduces the bug.
    validations:
      required: true
