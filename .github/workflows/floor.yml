name: Lowest React Native
on:
  push:
    branches:
      - main
    paths:
      - android/**
      - ios/**
      - src/**
      - package.json
      - ReactNativeInkpad.podspec
      - .github/workflows/floor.yml
  pull_request:
    branches:
      - main
    paths:
      - android/**
      - ios/**
      - src/**
      - package.json
      - ReactNativeInkpad.podspec
      - .github/workflows/floor.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android, ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: lowest React Native
            rn: floor
            ink: pinned
          - label: newest androidx.ink
            rn: latest
            ink: newest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Pack the library
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Create an app on the lowest React Native the peer range allows
        if: matrix.rn == 'floor'
        run: |
          floor=$(node -p "require('./package.json').peerDependencies['react-native'].match(/\d+\.\d+/)[0]")
          version=$(npm view "react-native@~$floor.0" version --json | jq -r 'if type == "array" then last else . end')
          echo "React Native $version"
          npx --yes @react-native-community/cli@20.2.0 init InkpadFloor --version "$version" --pm npm --skip-git-init --install-pods false --directory "$RUNNER_TEMP/app"

      - name: Create an app on the latest React Native
        if: matrix.rn == 'latest'
        run: |
          version=$(npm view react-native@latest version)
          echo "React Native $version"
          npx --yes @react-native-community/cli@latest init InkpadFloor --version "$version" --pm npm --skip-git-init --install-pods false --directory "$RUNNER_TEMP/app"

      - name: Force the newest androidx.ink
        if: matrix.ink == 'newest'
        run: |
          version=$(curl -fsSL https://dl.google.com/android/maven2/androidx/ink/ink-brush/maven-metadata.xml | sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p')
          echo "androidx.ink $version"
          echo "INK_VERSION=$version" >> "$GITHUB_ENV"
          printf '%s\n' "allprojects {" "  configurations.configureEach {" "    resolutionStrategy.eachDependency { details ->" "      if (details.requested.group == 'androidx.ink') details.useVersion(System.getenv('INK_VERSION'))" "    }" "  }" "}" > "$RUNNER_TEMP/ink.gradle"
          echo "INK_INIT=$RUNNER_TEMP/ink.gradle" >> "$GITHUB_ENV"

      - name: Install the packed library
        working-directory: ${{ runner.temp }}/app
        run: |
          npm install "$RUNNER_TEMP"/react-native-inkpad-*.tgz
          printf '%s\n' "import { InkCanvas } from 'react-native-inkpad';" "" "export default function App() {" "  return <InkCanvas style={{ flex: 1 }} />;" "}" > App.tsx

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-floor-${{ matrix.rn }}-${{ matrix.ink }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-floor-${{ matrix.rn }}-${{ matrix.ink }}-

      - name: Build the release app
        working-directory: ${{ runner.temp }}/app/android
        run: |
          args=(assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon)
          if [ -n "${INK_INIT:-}" ]; then args+=(--init-script "$INK_INIT"); fi
          ./gradlew "${args[@]}"
