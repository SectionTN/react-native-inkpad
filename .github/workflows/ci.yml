name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Build package
        run: yarn prepare

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prebuild the example
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      - name: Kotlin unit tests
        working-directory: example/android
        run: ./gradlew :react-native-inkpad:testDebugUnitTest --no-daemon

      - name: Build the release app for the emulator
        working-directory: example/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End-to-end tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_TELEMETRY_DISABLED: '1'
          INKPAD_APP_PATH: example/android/app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            yarn e2e --target android || (mkdir -p .e2e/artifacts; adb logcat -d > .e2e/artifacts/logcat.txt; adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' > .e2e/artifacts/focus.txt; exit 1)

      - name: Upload e2e artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android
          path: .e2e/artifacts
          if-no-files-found: warn
          retention-days: 7

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use Xcode 26
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: 26

      - name: Prebuild the example
        working-directory: example
        run: npx expo prebuild --platform ios

      - name: Build the release app for the simulator
        working-directory: example/ios
        run: >
          xcodebuild -workspace InkpadExample.xcworkspace -scheme InkpadExample
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: End-to-end tests
        env:
          E2E_TELEMETRY_DISABLED: '1'
          INKPAD_APP_PATH: example/ios/build/Build/Products/Release-iphonesimulator/InkpadExample.app
          E2E_IOS_DEVICE: iPhone 17
        run: yarn e2e --target ios

      - name: Upload e2e artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios
          path: .e2e/artifacts
          if-no-files-found: warn
          retention-days: 7
