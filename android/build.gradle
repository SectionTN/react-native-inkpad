buildscript {
  ext.Inkpad = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return Inkpad[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

// Codegen before RN 0.84 rejects the spec with an unclear error, so stop here first.
def reactNativeVersion = null
try {
  def reactNativePackage = providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim()
  reactNativeVersion = new groovy.json.JsonSlurper().parse(file(reactNativePackage)).version
} catch (Exception ignored) {
}
if (reactNativeVersion != null) {
  def (major, minor) = reactNativeVersion.tokenize(".").take(2)*.toInteger()
  if (major == 0 && minor < 84) {
    throw new GradleException("react-native-inkpad needs React Native 0.84 or newer (Expo SDK 56+), found $reactNativeVersion. Upgrade React Native or install react-native-inkpad@0.1.1.")
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "me.sectiontn.inkpad"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.ink:ink-authoring:1.0.0"
  implementation "androidx.ink:ink-brush:1.0.0"
  implementation "androidx.ink:ink-geometry:1.0.0"
  implementation "androidx.ink:ink-rendering:1.0.0"
  implementation "androidx.ink:ink-strokes:1.0.0"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20180813"
}
